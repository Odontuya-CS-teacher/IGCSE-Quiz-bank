</div></div><script>
const qs=[{"topic": "Character Sets", "q": "How is a character represented inside a computer?", "o": ["Each character is stored as an image.", "Each character is assigned a character-set code/value, which is stored in binary.", "Each character is stored only as its keyboard position.", "Each character is converted directly into a sound sample."], "a": "B"}, {"topic": "Character Sets", "q": "Which statement correctly compares ASCII and Unicode?", "o": ["ASCII represents more characters and languages than Unicode.", "ASCII and Unicode represent exactly the same number of characters.", "Unicode has a much larger character set and supports characters from many languages and symbols.", "Unicode can represent only English characters."], "a": "C"}, {"topic": "Character Sets", "q": "Traditionally, how many bits does ASCII use per character?", "o": ["7 bits", "8 bits", "16 bits", "32 bits"], "a": "A"}, {"topic": "Character Sets", "q": "How is the word “RED” represented using a character set?", "o": ["The whole word is assigned one single character code.", "Each character is assigned its own code, and the codes are stored in binary in the correct order.", "Only the first letter is converted to binary.", "The word is stored as three pixels."], "a": "B"}, {"topic": "Character Sets", "q": "Why might a text file be compressed?", "o": ["To reduce file size, storage space or transmission time.", "To increase the number of characters in the file.", "To increase the colour depth.", "To convert text into an analogue signal."], "a": "A"}, {"topic": "Image Representation", "q": "What is a pixel?", "o": ["The number of bits used to represent a colour.", "The width of an image.", "Additional information stored about an image.", "The smallest individual element of a bitmap image."], "a": "D"}, {"topic": "Image Representation", "q": "What does image resolution describe?", "o": ["The number of bits used for each pixel colour.", "The number or dimensions of pixels in the image, usually width × height.", "The number of colours available in the image.", "The date the photograph was taken."], "a": "B"}, {"topic": "Image Representation", "q": "What is colour depth?", "o": ["The number of pixels in the image.", "The physical depth of the screen.", "The number of bits used to represent the colour of each pixel.", "The number of images stored in a file."], "a": "C"}, {"topic": "Image Representation", "q": "What is a benefit of increasing colour depth?", "o": ["Fewer colours can be represented.", "The number of pixels is automatically reduced.", "The image must use less storage space.", "More colours or shades can be represented, allowing colour and detail to be represented more accurately."], "a": "D"}, {"topic": "Image Representation", "q": "An image has a 16-bit colour depth. What does this mean?", "o": ["16 bits are used to represent the colour of each pixel.", "The image contains exactly 16 pixels.", "The image is 16 pixels wide.", "16 bytes are used for the whole image."], "a": "A"}, {"topic": "Image Representation", "q": "An image changes from 1000 × 1750 pixels to 750 × 1500 pixels. If colour depth stays the same, what happens to file size?", "o": ["It increases.", "It stays exactly the same.", "It decreases because fewer pixels need to be stored.", "It becomes zero."], "a": "C"}, {"topic": "Image Representation", "q": "Which formula gives the number of colours represented by a given colour depth?", "o": ["colour depth × 2", "2^colour depth", "colour depth ÷ 2", "colour depth + 2"], "a": "B"}, {"topic": "Image Representation", "q": "Which is an example of metadata associated with an image?", "o": ["One pixel's colour value", "The binary value of one pixel", "The colour depth only", "The date/time taken or camera model"], "a": "D"}, {"topic": "Sound Representation", "q": "What is sample rate?", "o": ["The number of samples taken per second.", "The number of bits used for each sample.", "The number of speakers used.", "The number of sound files stored."], "a": "A"}, {"topic": "Sound Representation", "q": "What is sample resolution?", "o": ["The number of samples taken per second.", "The length of the recording in seconds.", "The number of bits used to represent each sample.", "The number of microphones used."], "a": "C"}, {"topic": "Sound Representation", "q": "What is a benefit of using a higher sample rate?", "o": ["It always produces a smaller file.", "More samples are taken each second, so the original analogue sound can be represented more accurately.", "Fewer samples are stored.", "It reduces the number of possible amplitude values."], "a": "B"}, {"topic": "Sound Representation", "q": "What is a drawback of increasing the sample rate?", "o": ["The sound becomes analogue again.", "Fewer samples are taken each second.", "The recording becomes less accurate.", "The file size increases because more sample data is stored."], "a": "D"}, {"topic": "Sound Representation", "q": "Why does higher sample resolution create a more accurate recording?", "o": ["Fewer amplitude values can be represented.", "More bits allow more amplitude values, so the stored value can be closer to the original amplitude.", "The sample rate becomes zero.", "It removes the need for sampling."], "a": "B"}, {"topic": "Sound Representation", "q": "Which is another way to improve the accuracy of a digital sound recording?", "o": ["Decrease the sample rate.", "Increase the sample rate.", "Reduce the number of bits per sample.", "Remove some samples."], "a": "B"}, {"topic": "Sound Representation", "q": "Which sequence correctly describes analogue sound being converted to digital data?", "o": ["Microphone records analogue sound → wave is sampled → amplitude is measured → each sample is converted to a binary value and stored.", "Binary data is created first → microphone converts it into an analogue wave.", "The microphone converts sound directly into text characters.", "The sound is stored as pixels before being converted to binary."], "a": "A"}];
